name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify native source matches the successful build
        run: |
          git fetch --depth=1 origin b441a8c3bfaa611a2dde69b7256a7d0de7ed1351
          test "$(git rev-parse HEAD:platform-tools-34)" = "$(git rev-parse b441a8c3bfaa611a2dde69b7256a7d0de7ed1351:platform-tools-34)"
      - name: Verify Material You, root and screen-off UI are unchanged
        run: git diff --exit-code b441a8c3bfaa611a2dde69b7256a7d0de7ed1351 -- app
      - name: Reuse unchanged ADB binaries from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43444806819 --repo zenxvolt/ScrcpyForAndroid --name ScrcpyForAndroid-1.8.0-b441a8c-debug --dir "$RUNNER_TEMP/previous-apk"
          python3 - <<'CHECK'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          apks = list((Path(os.environ['RUNNER_TEMP']) / 'previous-apk').glob('*.apk'))
          assert len(apks) == 1
          with ZipFile(apks[0]) as apk:
              for abi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']:
                  data = apk.read(f'lib/{abi}/libadb.so')
                  assert data[:4] == bytes([127, 69, 76, 70])
                  output = Path('app/src/main/jniLibs') / abi / 'libadb.so'
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(data)
          CHECK
      - name: Test server and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :server:testDebugUnitTest assembleScrcpyDebug -PskipLibadb --stacktrace
      - name: Verify packaged fix and APK signature
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          apks = list(Path('app/build/outputs/apk/scrcpy/debug').glob('*.apk'))
          assert apks
          for path in apks:
              with ZipFile(path) as apk:
                  with ZipFile(BytesIO(apk.read('assets/scrcpy-server.jar'))) as server:
                      dex = b''.join(server.read(n) for n in server.namelist() if n.endswith('.dex'))
                      assert b'Lorg/server/scrcpy/control/PowerGesture;' in dex
                      assert b'Lorg/server/scrcpy/control/TouchWakeGate;' in dex
                      assert b'Lorg/server/scrcpy/device/ScreenState;' in dex
                      assert b'power-state-v2' in dex
          CHECK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          for APK in app/build/outputs/apk/scrcpy/debug/*.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            sha256sum "$APK"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ScrcpyForAndroid-1.8.0-b441a8c-power-state-v2-debug
          path: app/build/outputs/apk/scrcpy/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: server-test-results
          path: server/build/test-results/testDebugUnitTest/*.xml
